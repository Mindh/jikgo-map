<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>찍고 지도</title>
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #F5F0EB; }
    #status {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      padding: 14px 16px; font-family: -apple-system, sans-serif; font-size: 13px;
      color: #fff; background: #D85A30; display: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status"></div>
  <script>
    /*
     * 찍고 지도 페이지 (GitHub Pages 호스팅용)
     * - 앱(React Native WebView)이 이 페이지를 열고, JIKGO_render(json)로 마커를 주입합니다.
     * - 마커 탭 등 이벤트는 postMessage로 앱에 전달합니다.
     * - NCP Client ID는 URL 쿼리(?ncpKeyId=...)로 전달받습니다.
     */
    var map = null;
    var markers = [];
    var pendingData = null; // 지도 준비 전에 들어온 데이터 보관

    function post(obj) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(obj));
      }
    }

    function showStatus(msg) {
      var el = document.getElementById('status');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // 네이버 인증 실패 시 호출되는 전역 콜백
    window.navermap_authFailure = function () {
      showStatus('네이버 지도 인증 실패 — NCP에 이 페이지 도메인이 등록되었는지 확인하세요.');
      post({ type: 'error', message: 'auth_failure' });
    };

    // 앱에서 마커 데이터를 주입할 때 호출하는 함수
    window.JIKGO_render = function (json) {
      var payload;
      try {
        payload = JSON.parse(json);
      } catch (e) {
        return;
      }
      if (!map) {
        pendingData = payload; // 지도 아직 준비 안 됨 → 보관
        return;
      }
      drawMarkers(payload);
    };

    function drawMarkers(payload) {
      var data = payload.markers || [];
      var selectedId = payload.selectedId || null;

      markers.forEach(function (m) { m.setMap(null); });
      markers = [];

      if (data.length === 0) return;

      var bounds = new naver.maps.LatLngBounds();
      data.forEach(function (d) {
        var pos = new naver.maps.LatLng(d.lat, d.lng);
        bounds.extend(pos);
        var isSelected = d.id === selectedId;
        var marker = new naver.maps.Marker({
          position: pos,
          map: map,
          title: d.name,
          zIndex: isSelected ? 1000 : 1,
          icon: {
            content:
              '<div style="' +
                'transform: translate(-50%, -100%);' +
                'background:' + (isSelected ? '#D85A30' : '#1A1A1A') + ';' +
                'color:#fff; padding:6px 10px; border-radius:18px;' +
                'font-family:-apple-system,sans-serif; font-size:13px; font-weight:600;' +
                'white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,0.25);' +
                'border:2px solid #fff;' +
              '">' + (d.emoji ? escapeHtml(d.emoji) + ' ' : '') + escapeHtml(d.name) + '</div>',
            anchor: new naver.maps.Point(0, 0),
          },
        });
        (function (id) {
          naver.maps.Event.addListener(marker, 'click', function () {
            post({ type: 'select', id: id });
          });
        })(d.id);
        markers.push(marker);
      });

      if (data.length > 1) {
        map.fitBounds(bounds, { top: 70, right: 60, bottom: 120, left: 60 });
      } else {
        map.setCenter(bounds.getCenter());
        map.setZoom(15);
      }
    }

    function initMap() {
      map = new naver.maps.Map('map', {
        center: new naver.maps.LatLng(37.5665, 126.9780),
        zoom: 12,
        mapDataControl: false,
        scaleControl: false,
        logoControl: true,
      });
      post({ type: 'ready' });
      if (pendingData) {
        drawMarkers(pendingData);
        pendingData = null;
      }
    }

    // 시작: URL 쿼리에서 NCP 키를 읽어 네이버 지도 스크립트 로드
    (function () {
      var params = new URLSearchParams(location.search);
      var ncpKey = params.get('ncpKeyId') || '';
      if (!ncpKey) {
        showStatus('지도 키가 없습니다 (?ncpKeyId= 누락).');
        post({ type: 'error', message: 'missing_key' });
        return;
      }
      var s = document.createElement('script');
      s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(ncpKey);
      s.onload = function () {
        try { initMap(); }
        catch (e) { showStatus('지도 초기화 실패: ' + e.message); post({ type: 'error', message: String(e) }); }
      };
      s.onerror = function () {
        showStatus('네이버 지도 스크립트 로드 실패.');
        post({ type: 'error', message: 'script_load_failed' });
      };
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
