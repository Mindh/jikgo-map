<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>찍고 지도</title>
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #F4F5F9; }
    #status {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      padding: 14px 16px; font-family: -apple-system, sans-serif; font-size: 13px;
      color: #fff; background: #E25C5C; display: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status"></div>
  <script>
    /*
     * 찍고 지도 페이지 v2 (GitHub Pages 호스팅용)
     * 외부 API:
     *   JIKGO_setMarkers(json)  — 마커 배열 교체 + 자동 fitBounds
     *   JIKGO_setSelected(id)   — 선택 상태만 변경 (지도 이동 없음)
     *   JIKGO_setCenter(lat,lng,zoom?)  — 지도 중심을 명시적으로 이동
     * 이벤트 (postMessage로 RN에 전달):
     *   { type: 'ready' }
     *   { type: 'select', id }
     *   { type: 'idle',  lat, lng, zoom }   — 지도 이동/줌 완료 시
     *   { type: 'error', message }
     */
    var map = null;
    var allMarkers = []; // [{ marker, data }]
    var currentSelectedId = null;

    // 지도 준비 전에 들어온 호출을 보관
    var pendingMarkers = null;
    var pendingSelected = null;
    var pendingCenter = null;

    function post(obj) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(obj));
      }
    }

    function showStatus(msg) {
      var el = document.getElementById('status');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    window.navermap_authFailure = function () {
      showStatus('네이버 지도 인증 실패 — NCP에 이 페이지 도메인이 등록되었는지 확인하세요.');
      post({ type: 'error', message: 'auth_failure' });
    };

    function buildIcon(d, isSelected) {
      return {
        content:
          '<div style="' +
            'transform: translate(-50%, -100%);' +
            'background:' + (isSelected ? '#6C63FF' : '#1A1A2E') + ';' +
            'color:#fff; padding:6px 10px; border-radius:18px;' +
            'font-family:-apple-system,sans-serif; font-size:13px; font-weight:600;' +
            'white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,0.25);' +
            'border:2px solid #fff;' +
          '">' + (d.emoji ? escapeHtml(d.emoji) + ' ' : '') + escapeHtml(d.name) + '</div>',
        anchor: new naver.maps.Point(0, 0),
      };
    }

    function applyMarkers(data) {
      // 기존 마커 제거
      allMarkers.forEach(function (m) { m.marker.setMap(null); });
      allMarkers = [];

      if (!data || data.length === 0) return;

      var bounds = new naver.maps.LatLngBounds();
      data.forEach(function (d) {
        var pos = new naver.maps.LatLng(d.lat, d.lng);
        bounds.extend(pos);
        var marker = new naver.maps.Marker({
          position: pos,
          map: map,
          title: d.name,
          zIndex: d.id === currentSelectedId ? 1000 : 1,
          icon: buildIcon(d, d.id === currentSelectedId),
        });
        (function (id) {
          naver.maps.Event.addListener(marker, 'click', function () {
            post({ type: 'select', id: id });
          });
        })(d.id);
        allMarkers.push({ marker: marker, data: d });
      });

      if (data.length > 1) {
        map.fitBounds(bounds, { top: 80, right: 60, bottom: 160, left: 60 });
      } else {
        map.setCenter(bounds.getCenter());
        if (map.getZoom() < 14) map.setZoom(15);
      }
    }

    function applySelection(id) {
      currentSelectedId = id;
      allMarkers.forEach(function (m) {
        var isSelected = m.data.id === id;
        m.marker.setIcon(buildIcon(m.data, isSelected));
        m.marker.setZIndex(isSelected ? 1000 : 1);
      });
    }

    window.JIKGO_setMarkers = function (json) {
      var data;
      try { data = JSON.parse(json); }
      catch (e) { return; }
      if (!map) { pendingMarkers = data; return; }
      applyMarkers(data);
    };

    window.JIKGO_setSelected = function (id) {
      if (!map) { pendingSelected = id; return; }
      applySelection(id);
    };

    window.JIKGO_setCenter = function (lat, lng, zoom) {
      if (!map) { pendingCenter = { lat: lat, lng: lng, zoom: zoom }; return; }
      map.setCenter(new naver.maps.LatLng(lat, lng));
      if (zoom != null) map.setZoom(zoom);
    };

    function initMap() {
      map = new naver.maps.Map('map', {
        center: new naver.maps.LatLng(37.5665, 126.9780),
        zoom: 13,
        mapDataControl: false,
        scaleControl: false,
        logoControl: true,
      });

      // 지도 이동/줌 완료 시 알림
      naver.maps.Event.addListener(map, 'idle', function () {
        var c = map.getCenter();
        post({ type: 'idle', lat: c.lat(), lng: c.lng(), zoom: map.getZoom() });
      });

      post({ type: 'ready' });

      // 보관해둔 호출 처리 (순서 중요: center → markers → selected)
      if (pendingCenter) {
        map.setCenter(new naver.maps.LatLng(pendingCenter.lat, pendingCenter.lng));
        if (pendingCenter.zoom != null) map.setZoom(pendingCenter.zoom);
        pendingCenter = null;
      }
      if (pendingMarkers) {
        applyMarkers(pendingMarkers);
        pendingMarkers = null;
      }
      if (pendingSelected) {
        applySelection(pendingSelected);
        pendingSelected = null;
      }
    }

    (function () {
      var params = new URLSearchParams(location.search);
      var ncpKey = params.get('ncpKeyId') || '';
      if (!ncpKey) {
        showStatus('지도 키가 없습니다 (?ncpKeyId= 누락).');
        post({ type: 'error', message: 'missing_key' });
        return;
      }
      var s = document.createElement('script');
      s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(ncpKey);
      s.onload = function () {
        try { initMap(); }
        catch (e) { showStatus('지도 초기화 실패: ' + e.message); post({ type: 'error', message: String(e) }); }
      };
      s.onerror = function () {
        showStatus('네이버 지도 스크립트 로드 실패.');
        post({ type: 'error', message: 'script_load_failed' });
      };
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
